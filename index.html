<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
    <title>Mintlify</title>
</head>

<body>
    <header class="header">
        <div class="header-wrapper">
        <img src="assets/Mintlify.png" alt="" class="mintlify-logo">
        <nav class="nav">
            <ul class="nav-items">
                <li class="nav-item"><a href="">Resources</a></li>
                <li class="nav-item"><a href="">Documentation</a></li>
                <li class="nav-item"><a href="">Customers</a></li>
                <li class="nav-item"><a href="">Blog</a></li>
                <li class="nav-item"><a href="">Pricing</a></li>
            </ul>
        </nav>
        <div class="primary-cta">
            <button class="contact-sales-btn">Contact sales</button>
            <button class="start-free-btn">Start for free</button>
        </div>
        </div>

    </header>

    <main class="main">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="bg-image"></div>
            <div class="hero-content">
                <div class="hero-section-link">
                    <span class="sub-line">NEW</span>
                    <a href="#">
                        Self-updating docs with agent suggestions
                    </a>
                    <span class="arrow-icon">➔</span>
                </div>

                <div class="hero-section-content">
                    <h1>The Intelligent Knowledge Platform</h1>
                    <p>Helping teams create and maintain world-class documentation built for both humans and AI</p>
                    <div class="email-cta">
                        <input type="text" placeholder="Email address">
                        <button>Start now</button>
                    </div>
                </div>

            </div>
            <div class="doc-prev-section">
                <img src="assets/hero-image-light.svg" alt="Documentation preview">
            </div>
        </section>

        <!-- Documentation Preview Section -->


        <!-- Trusted By/ Logos -->
        <section class="logos">
            <img src="assets/Logo.svg" alt="Anthropic">
            <img src="assets/coinbase.svg" alt="Coinbase">
            <img src="assets/microsoft.svg" alt="Microsoft">
            <img src="assets/perplexity.png" alt="Perplexity">
            <img src="assets/hubspot.svg" alt="Hubspot">
            <img src="assets/x.svg" alt="X">
            <img src="assets/paypal.svg" alt="Paypal">
            <img src="assets/lovable.svg" alt="Lovable">
        </section>

<!-- intelligence age -->
        <section class="feature-container">
            <h1 class="feature-heading"></h1>
            <p class="feature-detail"></p>
        </section>
    </main>
</body>

</html>
